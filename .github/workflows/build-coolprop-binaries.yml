name: Build CoolProp binaries

on:
  workflow_dispatch:
    inputs:
      coolprop_repo:
        required: true
        description: "owner/repo to build from"
        default: "CoolProp/CoolProp"
      coolprop_ref:
        required: true
        description: "Branch, tag, or commit"
        default: "v8.0.0"

jobs:
  build-coolprop-binaries:
    name: ${{ matrix.platform.label }} (${{ matrix.lib-type }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04-arm
            label: linux-aarch64
          - os: ubuntu-latest
            label: linux-x86-64
          - os: macos-latest
            label: macos-aarch64
          - os: macos-15-intel
            label: macos-x86-64
          - os: windows-11-arm
            label: windows-aarch64
          - os: windows-latest
            label: windows-x86-64
          - os: ubuntu-latest
            label: wasm32-unknown-emscripten
        lib-type: [shared, static]

    steps:
      - name: Checkout CoolProp repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.inputs.coolprop_repo }}
          ref: ${{ github.event.inputs.coolprop_ref }}
          submodules: recursive
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.14
      - name: Restore Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install six
      - name: Setup Emscripten (wasm32-unknown-emscripten)
        if: matrix.platform.label == 'wasm32-unknown-emscripten'
        uses: emscripten-core/setup-emsdk@v15
      - name: Build a Makefile (Standard Platforms)
        if: matrix.platform.label != 'wasm32-unknown-emscripten'
        run: |
          if [ "${{ matrix.lib-type }}" = "shared" ]; then
            cmake . -DCOOLPROP_SHARED_LIBRARY=ON -DCMAKE_BUILD_TYPE=Release -DFORCE_BITNESS_NATIVE=ON
          else
            cmake . -DCOOLPROP_STATIC_LIBRARY=ON -DCMAKE_BUILD_TYPE=Release -DFORCE_BITNESS_NATIVE=ON -DCMAKE_CXX_FLAGS="-DCOOLPROP_LIB" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          fi
        shell: bash

      - name: Build a Makefile (wasm32-unknown-emscripten)
        if: matrix.platform.label == 'wasm32-unknown-emscripten'
        run: |
          if [ "${{ matrix.lib-type }}" = "shared" ]; then
            emcmake cmake . \
              -DCOOLPROP_SHARED_LIBRARY=ON \
              -DCOOLPROP_STATIC_LIBRARY=OFF \
              -DCMAKE_C_FLAGS="-DCOOLPROP_NO_INCBIN -fwasm-exceptions -fPIC" \
              -DCMAKE_CXX_FLAGS="-DCOOLPROP_NO_INCBIN -fwasm-exceptions -fPIC" \
              -DCMAKE_BUILD_TYPE=Release
          else
            emcmake cmake . \
              -DCOOLPROP_EXTERNC_LIBRARY=ON \
              -DCOOLPROP_STATIC_LIBRARY=ON \
              -DCMAKE_C_FLAGS="-DCOOLPROP_NO_INCBIN -fwasm-exceptions -fPIC" \
              -DCMAKE_CXX_FLAGS="-DCOOLPROP_NO_INCBIN -fwasm-exceptions -fPIC" \
              -DCMAKE_BUILD_TYPE=Release
          fi
        shell: bash

      - name: Build CoolProp binaries
        run: cmake --build . --config Release
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: CoolProp ${{ github.event.inputs.coolprop_version }} (${{ matrix.platform.label }}-${{ matrix.lib-type }})
          path: |
            Release/*.dll
            Release/*.lib
            *.dylib
            *.so
            *.a
          if-no-files-found: error